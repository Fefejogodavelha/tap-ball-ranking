name: Save Ranking

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Nome do jogador'
        required: true
        type: string
      score:
        description: 'Pontuação'
        required: true
        type: string
      timestamp:
        description: 'ISO timestamp'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          ref: main

      - name: Atualizar ranking.json e push (com retry em conflito)
        env:
          NAME: ${{ github.event.inputs.name }}
          SCORE_INPUT: ${{ github.event.inputs.score }}
          TIMESTAMP: ${{ github.event.inputs.timestamp }}
        run: |
          set -euo pipefail
          MAX_ATTEMPTS=5

          TS="${TIMESTAMP:-}"
          if [ -z "${TS}" ]; then
            TS="$(node -e 'console.log(new Date().toISOString())')"
          fi

          apply_and_push() {
            git fetch origin main --force --quiet
            git reset --hard origin/main --quiet
            git pull origin main --quiet || true

            NAME_CLEAN="$(node -e 'process.stdout.write(process.argv[1].trim().slice(0,16).replace(/[\\r\\n]/g," "))' "$NAME")"
            if [ -z "$NAME_CLEAN" ]; then
              echo "::error::Nome vazio apos limpeza"
              return 2
            fi

            node scripts/apply-score.js "$NAME_CLEAN" "$SCORE_INPUT" "$TS"

            git add ranking.json
            if git diff --cached --quiet; then
              echo "Nenhuma alteracao necessaria (melhor pontuacao ja registrada)"
              return 0
            fi
            git -c user.name='tap-ball-ranker[bot]' -c user.email='actions@users.noreply.github.com' commit -m "score($NAME_CLEAN): $SCORE_INPUT" --quiet
            if git push origin HEAD:main --quiet; then
              return 0
            else
              echo "Push conflitou (escrita concorrente); tentando re-sincronizar"
              return 1
            fi
          }

          for i in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "-- tentativa $i --"
            if apply_and_push; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::Nao foi possivel concluir o push apos $MAX_ATTEMPTS tentativas"
          exit 1