name: Save Ranking

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Nome do jogador'
        required: true
        type: string
      score:
        description: 'Pontuação'
        required: true
        type: string
      timestamp:
        description: 'ISO timestamp'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          ref: main

      - name: Atualizar ranking.json e push (com retry em conflito)
        env:
          NAME: ${{ github.event.inputs.name }}
          SCORE_INPUT: ${{ github.event.inputs.score }}
          TIMESTAMP: ${{ github.event.inputs.timestamp }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MAX_ATTEMPTS=5

          if [ -n "$TIMESTAMP" ]; then
            TS="$TIMESTAMP"
          else
            TS="$(node -e 'console.log(new Date().toISOString())')"
          fi

          apply_and_push() {
            git fetch origin main --force --quiet
            git reset --hard origin/main --quiet
            git pull origin main --quiet || true

            NAME_CLEAN="$(node -e 'process.stdout.write(process.argv[1].trim().slice(0,16).replace(/[\r\n]/g," "))' "$NAME")"
            if [ -z "$NAME_CLEAN" ]; then
              echo "::error::Nome vazio apos limpeza"
              return 2
            fi
            SCORE="$((10#$SCORE_INPUT))" || true
            SCORE="$(node -e 'const s=Number(process.argv[1]);process.stdout.write(String(Number.isFinite(s)?Math.max(0,Math.floor(s)):0))' "$SCORE_INPUT")"

            node - "$NAME_CLEAN" "$SCORE" "$TS" <<'NODE'
            const fs = require('fs');
            const [name, score, ts] = process.argv.slice(2);
            let list = [];
            try { list = JSON.parse(fs.readFileSync('ranking.json','utf8')); } catch(_) {}
            if (!Array.isArray(list)) list = [];
            // Regra: manter a melhor pontuação por nome.
            // nova substitui antiga APENAS se nova >= antiga (mesmo nome).
            let key = null;
            for (let i=0;i<list.length;i++){
              if (list[i] && list[i].nome === name){ key = i; break; }
            }
            if (key !== null) {
              const old = Number(list[key].pontos) || 0;
              const s = Number(score);
              if (s >= old) {
                list[key].pontos = s;
                list[key].data = ts;
              }
              // s < old => mantém a antiga (não sobrescreve)
            } else {
              list.push({ nome: name, pontos: Number(score), data: ts });
            }
            // ordena: pontos desc, empate -> mais recente primeiro
            list.sort((a,b)=>{
              const ba = Number(b.pontos)||0, aa=Number(a.pontos)||0;
              if (ba!==aa) return ba-aa;
              return String(b.data||'').localeCompare(String(a.data||''));
            });
            // manter top 200 (amplo; exibe top 10)
            list = list.slice(0, 200);
            fs.writeFileSync('ranking.json', JSON.stringify(list, null, 2) + '\n');
NODE

            git add ranking.json
            if git diff --cached --quiet; then
              echo "Nenhuma alteracao necessaria (ja e a melhor pontuacao ou igual)"
              return 0
            fi
            git -c user.name='tap-ball-ranker[bot]' -c user.email='actions@users.noreply.github.com' commit -m "score(${NAME_CLEAN}): ${SCORE}" --quiet
            if git push origin HEAD:main --quiet; then
              return 0
            else
              echo "Push conflitou (escrita concorrente); tentando re-basear"
              return 1
            fi
          }

          for i in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "-- tentativa $i --"
            if apply_and_push; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::Nao foi possivel concluir o push apos $MAX_ATTEMPTS tentativas"
          exit 1
